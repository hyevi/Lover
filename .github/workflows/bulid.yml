name: Build LOVER Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - List files
        run: |
          echo "=== Files in .github/workflows/ ==="
          Get-ChildItem -Path ".github/workflows/" -Force
          echo "=== Files in root ==="
          Get-ChildItem -Path "." -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract lover_firm.zip
        run: |
          if (Test-Path ".github/workflows/lover_firm.zip") {
            Expand-Archive -Path ".github/workflows/lover_firm.zip" -DestinationPath "src" -Force
            echo "=== Extracted files ==="
            Get-ChildItem -Recurse src
          } else {
            echo "ERROR: lover_firm.zip not found in .github/workflows/"
            exit 1
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          cd src
          if (Test-Path "icon.ico") {
            pyinstaller --onefile --windowed --icon icon.ico --add-data "config.json;." --add-data "launcher;launcher" main.py
          } else {
            pyinstaller --onefile --windowed --add-data "config.json;." --add-data "launcher;launcher" main.py
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOVER-Installer
          path: src/dist/main.exe

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/dist/main.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
