name: Build LOVER Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract lover_firm.zip
        run: |
          if (Test-Path ".github/workflows/lover_firm.zip") {
            Expand-Archive -Path ".github/workflows/lover_firm.zip" -DestinationPath "src" -Force
          } else {
            Write-Error "ERROR: lover_firm.zip not found in .github/workflows/"
            exit 1
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          # Ищем main.py в любом месте внутри папки src (даже если он в подпапке)
          $mainFile = Get-ChildItem -Path "src" -Recurse -Filter "main.py" | Select-Object -First 1
          if (-not $mainFile) {
            Write-Error "ERROR: main.py not found inside lover_firm.zip!"
            exit 1
          }
          
          # Переходим в ту папку, где он лежит
          $workDir = $mainFile.DirectoryName
          Write-Host "Found main.py in: $workDir"
          cd $workDir
          
          # Собираем
          if (Test-Path "icon.ico") {
            pyinstaller --onefile --windowed --icon icon.ico --add-data "config.json;." --add-data "launcher;launcher" main.py
          } else {
            pyinstaller --onefile --windowed --add-data "config.json;." --add-data "launcher;launcher" main.py
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOVER-Installer
          # Ищем собранный exe по всей папке src
          path: src/**/dist/main.exe

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/**/dist/main.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
